<style>

*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;transition:background .25s,color .25s}
.loading-bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent),#ffb347);z-index:9999;display:none;transition:width .3s}.loading-bar.active{display:block;width:75%}.loading-bar.done{width:100%;opacity:0;transition:width .2s,opacity .4s}

.logo-icon{font-size:1.4rem;cursor:pointer;flex-shrink:0}

.tabs{display:flex;background:var(--bg2);overflow-x:auto;flex-shrink:0;gap:3px;padding:4px 8px;align-items:center;min-height:38px;border-bottom:1px solid var(--border)}
.tabs.mobile-tabs{gap:0;padding:0}.tabs.mobile-tabs .tab{flex:1;min-width:0;max-width:none;justify-content:center;border-radius:0;padding:8px 4px;font-size:.7rem}

.content{flex:1;position:relative;background:var(--bg);min-height:0}
.page-container{position:absolute;inset:0;display:none;overflow:hidden}.page-container.active{display:flex;flex-direction:column}

.home-logo{font-size:2.5rem;text-align:center;margin-bottom:4px}.home-title{font-size:1.6rem;font-weight:bold;color:var(--accent);text-align:center;margin-bottom:6px}

.search-input{flex:1;background:transparent;border:none;padding:12px 16px;color:var(--text);font-size:.95rem;outline:none}

.settings-card{background:var(--card);padding:20px;border-radius:14px;max-width:500px;width:100%;border:1px solid var(--border);margin:0 auto}

.font-preview{background:var(--bg3);padding:10px;border-radius:8px;margin:6px 0;text-align:center;font-size:1rem;border:1px dashed var(--border)}
.battery-preview{display:flex;gap:12px;flex-wrap:wrap;padding:10px;background:var(--bg3);border-radius:8px;margin:6px 0;justify-content:center;align-items:center}
.battery-preview-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6rem;color:var(--text2)}

.cmd-box{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.cmd-input{padding:14px 16px;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:1rem;outline:none;font-family:var(--font)}
.cmd-list{overflow-y:auto;padding:6px}
.cmd-item{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-radius:8px;font-size:.85rem}
.cmd-item:hover,.cmd-item.sel{background:var(--bg3)}
.cmd-kind{font-size:.65rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--bg2);padding:2px 6px;border-radius:6px}
.font-segoe{--font:'Segoe UI',system-ui,-apple-system,sans-serif}.font-system{--font:system-ui,-apple-system,'Segoe UI',sans-serif}.font-monospace{--font:Consolas,'Courier New',monospace}.font-serif{--font:Georgia,'Times New Roman',serif}.font-comic{--font:'Comic Sans MS','Chalkboard SE',cursive}.font-georgia{--font:Georgia,'Times New Roman',serif}.font-verdana{--font:Verdana,Geneva,sans-serif}.font-tahoma{--font:Tahoma,Geneva,sans-serif}.font-courier{--font:'Courier New',Courier,monospace}.font-impact{--font:Impact,'Arial Black',sans-serif}.font-arial{--font:Arial,Helvetica,sans-serif}.font-times{--font:'Times New Roman',Times,serif}.font-minecraft{--font:'Press Start 2P','Courier New',monospace}.font-vt323{--font:'VT323','Courier New',monospace}.font-silkscreen{--font:'Silkscreen','Courier New',monospace}.font-roboto{--font:'Roboto',system-ui,sans-serif}.font-opensans{--font:'Open Sans',system-ui,sans-serif}.font-oswald{--font:'Oswald',system-ui,sans-serif}

<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="header" id="mainHeader">
<span class="logo-icon" id="homeBtn" title="Домой">🌐</span>
<button class="home-nav-btn" id="homeNavBtn" title="На главную">🏠</button>

var $=function(id){return document.getElementById(id)};
var ls={
  get:function(k,d){try{var v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
function eh(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
var _toastTimeout=null;
function showToast(msg,dur){
  var old=document.querySelectorAll('.toast');old.forEach(function(t){t.remove()});
  clearTimeout(_toastTimeout);
  var t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  _toastTimeout=setTimeout(function(){
    t.style.opacity='0';t.style.transition='opacity .3s';
    setTimeout(function(){if(t.parentNode)t.remove()},320);
  },dur||2200);
}
function showLoading(){var b=$('loadingBar');if(b){b.classList.remove('done');b.classList.add('active')}}
function hideLoading(){var b=$('loadingBar');if(!b)return;b.classList.add('done');setTimeout(function(){b.classList.remove('active','done')},500)}
function debounce(fn,wait){var t;return function(){var a=arguments,c=this;clearTimeout(t);t=setTimeout(function(){fn.apply(c,a)},wait)}}
function fmtSize(b){
  if(b==null||isNaN(b))return'—';
  if(b<1024)return b+' Б';
  if(b<1048576)return(b/1024).toFixed(1)+' КБ';
  if(b<1073741824)return(b/1048576).toFixed(2)+' МБ';
  return(b/1073741824).toFixed(2)+' ГБ';
}
function isUrl(s){
  if(!s||typeof s!=='string')return false;
  s=s.trim();
  if(s.indexOf('about:')===0)return false;
  if(/^https?:\/\//.test(s))return true;
  return /^[\w\-]+(\.[\w\-]+)+([\/\?#].*)?$/.test(s)||/^localhost(:\d+)?/.test(s)||/^\d{1,3}(\.\d{1,3}){3}/.test(s);
}
function fixUrl(u){return /^https?:\/\//.test(u)?u:'https://'+u}

// ============ ЗАГРУЗКИ ============
var IDB_NAME='anobrowser_downloads',IDB_STORE='files',downloads=[],dlAborts={};
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:'id'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbPut(it){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite'),st=tx.objectStore(IDB_STORE),r=st.put(it);r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)}})}
async function idbGet(id){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readonly'),st=tx.objectStore(IDB_STORE),r=st.get(id);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
async function idbDel(id){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite'),st=tx.objectStore(IDB_STORE),r=st.delete(id);r.onsuccess=function(){res()};r.onerror=function(){rej(r.error)}})}
async function idbAll(){var db=await idbOpen();return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readonly'),st=tx.objectStore(IDB_STORE),r=st.getAll();r.onsuccess=function(){res(r.result||[])};r.onerror=function(){rej(r.error)}})}
function triggerSave(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
async function loadDownloads(){
  try{var all=await idbAll();downloads=all.sort(function(a,b){return(b.time||0)-(a.time||0)})}catch(e){downloads=[]}
  state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
}
function renderDownloads(tab){
  var list=tab.pages.downloads.querySelector('[data-role="downloadsList"]');
  if(!list)return;
  if(downloads.length===0){list.innerHTML='<div class="empty-state">Нет загрузок</div>';return}
  list.innerHTML=downloads.map(function(d){
    var stMap={'queued':'⏳ В очереди','progress':'⏳ Загрузка...','done':'✅ Готово','error':'❌ Ошибка','cancelled':'⛔ Отменено'};
    var stTxt=stMap[d.status]||d.status;
    var pct=d.total?Math.round((d.received/d.total)*100):(d.status==='done'?100:0);
    var sizeTxt=d.status==='progress'||d.status==='queued'?fmtSize(d.received)+' / '+(d.total?fmtSize(d.total):'?'):fmtSize(d.size);
    var via=d.via&&d.status==='done'&&d.via!=='direct'?' <span style="color:var(--accent);font-size:.7rem">('+d.via+')</span>':'';
    var pb=d.status==='progress'?'<div class="dl-progress"><div style="width:'+pct+'%"></div></div>':'';
    var acts='';
    if(d.status==='done')acts='<button class="webview-btn" data-dl-open="'+d.id+'" type="button">📂 Открыть</button> <button class="webview-btn" data-dl-save="'+d.id+'" type="button">💾 Сохранить</button>';
    else if(d.status==='progress'||d.status==='queued')acts='<button class="webview-btn" data-dl-cancel="'+d.id+'" type="button">⛔ Отмена</button>';
    acts+=' <button class="webview-btn" data-dl-del="'+d.id+'" type="button">🗑️</button>';
    return '<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;gap:8px;align-items:center"><span>📄</span><div class="item-info"><div class="item-title">'+eh(d.name)+'</div><div class="item-url">'+stTxt+via+' • '+sizeTxt+'</div></div></div>'+pb+'<div style="display:flex;gap:4px;flex-wrap:wrap">'+acts+'</div></div>';
  }).join('');
}
async function openDownloaded(id){try{var it=await idbGet(id);if(!it||!it.blob){showToast('Файл не найден');return}var url=URL.createObjectURL(it.blob);window.open(url,'_blank');setTimeout(function(){URL.revokeObjectURL(url)},30000)}catch(e){showToast('Ошибка: '+e.message)}}
async function saveDownloaded(id){try{var it=await idbGet(id);if(!it||!it.blob){showToast('Файл не найден');return}triggerSave(it.blob,it.name)}catch(e){showToast('Ошибка: '+e.message)}}
async function deleteDownloaded(id){try{await idbDel(id);downloads=downloads.filter(function(d){return d.id!==id});state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});showToast('🗑️ Удалено')}catch(e){showToast('Ошибка: '+e.message)}}
async function clearAllDownloads(){
  if(!confirm('Удалить все загрузки?'))return;
  try{for(var i=0;i<downloads.length;i++)await idbDel(downloads[i].id);downloads=[];state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});showToast('🗑️ Очищено')}catch(e){showToast('Ошибка: '+e.message)}
}
function cancelDownload(id){
  if(dlAborts[id]){dlAborts[id].abort();return}
  var it=downloads.find(function(d){return d.id===id});
  if(it&&it.status==='queued'){it.status='cancelled';state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)})}
}

// ============ ТЕМА ============
function resolveTheme(){
  if(state.themeMode==='auto'){
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  }
  return state.theme;
}
function applyTheme(){
  var b=document.body;
  b.className='';
  if(state.incognito)b.classList.add('incognito-mode');
  else if(resolveTheme()==='light')b.classList.add('light-theme');
  if(state.style&&state.style!=='default')b.classList.add('style-'+state.style);
  b.classList.add('font-'+(state.font||'segoe'));
  if(state.nocturne)b.classList.add('nocturne');
  if(state.accentColor){
    document.documentElement.style.setProperty('--accent',state.accentColor);
  }else{
    document.documentElement.style.removeProperty('--accent');
  }
  applyWallpaper();
  applyTabMode();
  document.documentElement.style.setProperty('--page-font',state.pageFont+'%');
}
function applyWallpaper(){
  if(state.customWallpaper){
    document.documentElement.style.setProperty('--home-gradient','url('+state.customWallpaper+') center/cover');
    return;
  }
  var wp=WALLPAPERS.find(function(w){return w.name===state.wallpaper});
  if(wp){
    var val=resolveTheme()==='light'?(wp.l||wp.v):wp.v;
    document.documentElement.style.setProperty('--home-gradient',val);
  }
}
function applyTabMode(){
  var tc=$('tabsContainer');if(!tc)return;
  tc.classList.remove('mobile-tabs');
  var mode=state.tabMode==='auto'?(window.innerWidth<600?'mobile':'desktop'):state.tabMode;
  if(mode==='mobile')tc.classList.add('mobile-tabs');
}

var _batteryObj=null;
var _batteryBound=false;
function batColor(p){
  if(p>=80)return'#4ecca3';if(p>=50)return'#f0c040';if(p>=20)return'#ff9500';if(p>=10)return'#e04a62';if(p>=1)return'#e04a62';return'#666';
}
function buildBatterySVG(style,pct,chg){
  pct=Math.max(0,Math.min(100,pct));
  var c=batColor(pct),W=32,H=16;
  var b1=chg?'<text x="14" y="12" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">⚡</text>':'';
  var a1=(pct<10&&pct>=1&&!chg)?'<text x="14" y="12" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">!</text>':'';
  var x1=(pct===0)?'<text x="14" y="12" font-size="11" text-anchor="middle" fill="#999" font-weight="bold">✕</text>':'';
  var s='';
  if(style==='android'){
    var f=(W-6)*pct/100;
    s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect x="1" y="2" width="'+(W-2)+'" height="'+(H-4)+'" rx="3" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"/><rect x="3" y="4" width="'+f+'" height="'+(H-8)+'" rx="1.5" fill="'+c+'"/>'+b1+a1+x1+'</svg>';
  }else if(style==='ios'){
    var f2=24*pct/100;
    s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect x="1" y="2" width="27" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="29" y="6" width="2" height="4" rx="1" fill="currentColor" opacity=".55"/><rect x="2.5" y="3.5" width="'+f2+'" height="9" rx="2" fill="'+c+'"/>'+b1+a1+x1+'</svg>';
  }else if(style==='minecraft'){
    var blocks=10,filled=Math.round(blocks*pct/100),seg='';
    for(var i=0;i<blocks;i++){var x=2+i*2.4;seg+='<rect x="'+x+'" y="4" width="2.2" height="8" fill="'+(i<filled?c:'transparent')+'" stroke="'+c+'" stroke-width=".5"/>'}

function renderBatteryIcon(pct,chg){
  var w=$('batteryIndicator');if(!w)return;
  var st=state.batStyle||'classic',show=state.batShow||'yes',pos=state.batPos||'outside';
  var svg=buildBatterySVG(st,pct,chg);
  var tIn=(show==='yes'&&pos==='inside'),tOut=(show==='yes'&&pos==='outside');
  if(tIn&&pct>=10&&!chg){svg=svg.replace('</svg>','<text x="14" y="12" font-size="8" text-anchor="middle" fill="#fff" font-weight="bold">'+pct+'</text></svg>')}
  w.innerHTML=svg+(tOut?'<span class="battery-text">'+pct+'%</span>':'');
  var tt='Батарея: '+pct+'%';
  if(chg)tt+=' (заряжается)';
  if(pct===0)tt+=' — разряжена';
  else if(pct<10)tt+=' — критически низкий заряд';
  w.setAttribute('title',tt);
}
function renderBatteryPreview(tab){
  var wrap=tab.pages.settings.querySelector('[data-role="batteryPreview"]');if(!wrap)return;
  wrap.innerHTML=Object.keys(BAT_STYLES).map(function(s){
    return '<div class="battery-preview-item">'+buildBatterySVG(s,72,false)+'<span>'+BAT_STYLES[s]+'</span></div>';
  }).join('');
}
function updateBattery(){
  if(!navigator.getBattery){
    renderBatteryIcon(100,false);
    var w=$('batteryIndicator');
    if(w)w.setAttribute('title','Battery API не поддерживается');
    return;
  }
  if(_batteryObj){renderBatteryIcon(Math.round(_batteryObj.level*100),!!_batteryObj.charging);return}
  navigator.getBattery().then(function(b){
    _batteryObj=b;
    function u(){renderBatteryIcon(Math.round(b.level*100),!!b.charging)}
    u();
    if(!_batteryBound){
      b.addEventListener('levelchange',u);
      b.addEventListener('chargingchange',u);
      _batteryBound=true;
    }
  }).catch(function(){
    var w=$('batteryIndicator');
    if(w)w.innerHTML='<span class="battery-text">—</span>';
  });
}

function fetchWeather(city){
  return fetch('https://wttr.in/'+encodeURIComponent(city)+'?format=j1').then(function(r){return r.json()}).then(function(d){
    var c=d.current_condition[0];
    function em(code){
      if(code<=200)return'⛈️';
      if(code<=300)return'🌧️';
      if(code<=500)return'🌦️';
      if(code<=600)return'🌨️';
      if(code<=700)return'🌫️';
      if(code===800)return'☀️';
      return'☁️';
    }
    return{city:d.nearest_area[0].areaName[0].value,country:d.nearest_area[0].country[0].value,temp:c.temp_C,desc:c.weatherDesc[0].value,emoji:em(c.weatherCode),code:c.weatherCode};
  }).catch(function(){return null});
}
function updateWeatherWidgets(){
  var wData=state.weatherData;
  document.querySelectorAll('[data-role="weather"]').forEach(function(w){
    var icon=w.querySelector('.w-icon'),city=w.querySelector('.w-city'),desc=w.querySelector('.w-desc');
    if(!icon)return;
    if(wData){
      icon.textContent=wData.emoji;city.textContent=wData.city;
      var tEl=w.querySelector('.w-temp');
      if(!tEl){var t2=document.createElement('div');t2.className='w-temp';city.insertAdjacentElement('afterend',t2);tEl=t2}
      tEl.textContent=wData.temp+'°C';
      desc.textContent=wData.desc;
    }else{
      icon.textContent='🌤️';city.textContent='Погода';
      var te=w.querySelector('.w-temp');if(te)te.remove();
      desc.textContent='Выбрать город';
    }
  });
}
function updateClocks(){
  var now=new Date(),timeStr=now.toLocaleTimeString('ru-RU'),dateStr=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  document.querySelectorAll('[data-role="clock"]').forEach(function(el){el.textContent=timeStr});
  document.querySelectorAll('[data-role="clockDate"]').forEach(function(el){el.textContent=dateStr});
}

// ============ ВКЛАДКИ ============
function getTab(id){return state.tabs.find(function(x){return x.id===id})}
function activeTab(){return getTab(state.activeId)}
function createTab(url,bg){
  var id='tab_'+(state.tabCounter++);
  var tab={id:id,title:'Новая',url:url||'about:home',type:'home',pages:{},pinned:false};
  state.tabs.push(tab);
  if(!bg)state.activeId=id;
  try{buildTabPages(tab)}catch(e){console.error(e);showToast('Ошибка: '+e.message)}
  if(!bg)switchTab(id);else renderTabs();
  if(url&&url!=='about:home')setTimeout(function(){navigateToFor(tab,url)},50);
  return tab;
}
function switchTab(id){
  state.tabs.forEach(function(tab){Object.keys(tab.pages).forEach(function(k){tab.pages[k].classList.remove('active')})});
  state.activeId=id;
  var tab=getTab(id);if(!tab)return;
  var page=tab.pages[tab.type]||tab.pages.home;
  if(page)page.classList.add('active');
  var ui=$('urlInput');if(ui)ui.value=tab.url==='about:home'?'':(tab.url||'');
  applySiteZoom(tab);
  renderTabs();renderSidebar();renderBookmarksBar();updateCounter();
  if(tab.type==='settings')setTimeout(function(){renderBatteryPreview(tab)},30);
}
function closeTab(id){
  if(state.tabs.length<=1)return;
  var idx=state.tabs.findIndex(function(x){return x.id===id});
  if(idx===-1)return;
  var tab=state.tabs[idx];
  pushClosedTab(tab);
  Object.keys(tab.pages).forEach(function(k){tab.pages[k].remove()});
  state.tabs.splice(idx,1);
  if(state.activeId===id){
    var nIdx=Math.min(idx,state.tabs.length-1);
    switchTab(state.tabs[nIdx].id);
  }else{renderTabs();renderSidebar()}
  updateCounter();
}
function pushClosedTab(tab){
  if(!tab||!tab.url||tab.url==='about:home')return;
  state.recentlyClosed.unshift({url:tab.url,title:tab.title,time:Date.now()});
  if(state.recentlyClosed.length>20)state.recentlyClosed.length=20;
  ls.set(SK.recentlyClosed,state.recentlyClosed);
}
function restoreLastClosed(){
  if(state.recentlyClosed.length===0){showToast('Нет закрытых вкладок');return}
  var last=state.recentlyClosed.shift();
  ls.set(SK.recentlyClosed,state.recentlyClosed);
  createTab(last.url);
  showToast('↩️ Восстановлено: '+last.title);
}
function applySiteZoom(tab){
  var host=null;
  try{if(tab.url&&tab.url.indexOf('about:')!==0)host=new URL(tab.url).hostname}catch(e){}
  if(host&&state.siteZooms[host]){
    state.zoom=state.siteZooms[host];
    document.documentElement.style.setProperty('--zoom',state.zoom);
  }else{
    state.zoom=1;
    document.documentElement.style.setProperty('--zoom',1);
  }
}
function saveZoomForSite(){
  var tab=activeTab();if(!tab||!tab.url)return;
  var host=null;
  try{if(tab.url.indexOf('about:')!==0)host=new URL(tab.url).hostname}catch(e){}
  if(host){
    if(state.zoom===1)delete state.siteZooms[host];
    else state.siteZooms[host]=state.zoom;
    ls.set(SK.siteZooms,state.siteZooms);
  }
}
function changeZoom(d){
  state.zoom=Math.max(0.5,Math.min(2,state.zoom+d));
  document.documentElement.style.setProperty('--zoom',state.zoom);
  saveZoomForSite();
  showToast('Масштаб: '+Math.round(state.zoom*100)+'%');
}

// ============ RENDER UI ============
function renderTabs(){
  var tc=$('tabsContainer'),addBtn=$('addTabBtn');
  if(!tc||!addBtn)return;
  var old=tc.querySelectorAll('.tab');
  for(var i=0;i<old.length;i++)old[i].remove();
  state.tabs.forEach(function(tab){
    var el=document.createElement('div');
    el.className='tab'+(tab.id===state.activeId?' active':'')+(tab.pinned?' pinned':'');
    el.draggable=true;el.dataset.tabId=tab.id;
    el.innerHTML=(tab.pinned?'📌 ':'')+'<span style="flex:1;overflow:hidden;text-overflow:ellipsis">'+eh(tab.title||'Новая')+'</span>'+(tab.pinned?'':'<span class="tab-close">×</span>');
    el.addEventListener('click',function(e){if(!e.target.classList.contains('tab-close'))switchTab(tab.id)});
    el.addEventListener('contextmenu',function(e){e.preventDefault();tab.pinned=!tab.pinned;renderTabs()});
    el.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',tab.id)});
    el.addEventListener('dragover',function(e){e.preventDefault()});
    el.addEventListener('drop',function(e){
      e.preventDefault();
      var fid=e.dataTransfer.getData('text/plain');
      if(fid&&fid!==tab.id){
        var fi=state.tabs.findIndex(function(x){return x.id===fid});
        var ti=state.tabs.findIndex(function(x){return x.id===tab.id});
        var m=state.tabs.splice(fi,1)[0];
        state.tabs.splice(ti,0,m);
        renderTabs();
      }
    });
    var cb=el.querySelector('.tab-close');
    if(cb)cb.addEventListener('click',function(e){e.stopPropagation();closeTab(tab.id)});
    tc.insertBefore(el,addBtn);
  });
  updateCounter();renderSidebar();
}
function renderSidebar(){
  var list=$('sidebarList');if(!list)return;
  list.innerHTML=state.tabs.map(function(tab){
    return '<div class="sidebar-tab'+(tab.id===state.activeId?' active':'')+'" data-sidebar-id="'+tab.id+'"><span>'+(tab.pinned?'📌':'📄')+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">'+eh(tab.title||'Новая')+'</span><button class="item-delete" data-sidebar-close="'+tab.id+'">×</button></div>';
  }).join('');
  list.querySelectorAll('.sidebar-tab').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.sidebarClose)return;
      switchTab(el.dataset.sidebarId);
      $('sidebar').classList.remove('active');
    });
    var c=el.querySelector('[data-sidebar-close]');
    if(c)c.addEventListener('click',function(e){e.stopPropagation();closeTab(e.target.dataset.sidebarClose)});
  });
}
function renderBookmarksBar(){
  var bar=$('bookmarksBar');if(!bar)return;
  if(state.bookmarks.length===0){bar.style.display='none';return}
  bar.style.display='flex';
  bar.innerHTML=state.bookmarks.slice(0,12).map(function(b,i){
    return '<div class="bookmark-chip" data-url="'+eh(b.url)+'">'+eh((b.title||b.url).substring(0,25))+'<span class="chip-close" data-chip-close="'+i+'">×</span></div>';
  }).join('');
  bar.querySelectorAll('.bookmark-chip').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.chipClose!==undefined)return;
      navigateTo(el.dataset.url);
    });
    var c=el.querySelector('[data-chip-close]');
    if(c)c.addEventListener('click',function(e){
      e.stopPropagation();
      state.bookmarks.splice(parseInt(e.target.dataset.chipClose),1);
      ls.set(SK.bookmarks,state.bookmarks);
      renderBookmarksBar();
      var tab=activeTab();
      if(tab)renderBookmarks(tab);
    });
  });
}
function updateCounter(){
  var tc=$('tabCounter');if(tc)tc.textContent=state.tabs.length;
  var ab=$('avatarBtn');
  if(ab){
    if(state.account.avatar)ab.innerHTML='<img src="'+state.account.avatar+'">';
    else ab.textContent=(state.account.nickname||'?')[0].toUpperCase();

}
function rebuildQuickLinks(){
  state.tabs.forEach(function(tb){
    var h=tb.pages.home;if(!h)return;
    var dial=h.querySelector('.speed-dial');if(!dial)return;
    var newHtml=state.quickLinks.map(function(l,idx){

    }).join('');

    addNode.dataset.role='addLink';
    addNode.innerHTML='<span class="speed-icon">➕</span><span class="speed-title">Добавить</span>';
    dial.appendChild(addNode);
  });
}
function rebuildAllTabs(){
  var activeType=null;
  var activeUrl=null;
  if(state.activeId){
    var at=getTab(state.activeId);
    if(at){activeType=at.type;activeUrl=at.url}
  }
  state.tabs.forEach(function(tb){
    Object.keys(tb.pages).forEach(function(k){tb.pages[k].remove()});
    tb.pages={};
    try{buildTabPages(tb)}catch(e){console.error(e)}
  });
  state.tabs.forEach(function(tb){
    if(tb.type===activeType&&tb.url===activeUrl){switchTab(tb.id)}
  });
}

// ============ НАВИГАЦИЯ ============
function navigateTo(input){navigateToFor(activeTab(),input)}
function navigateToFor(tab,input){
  if(!tab||!input)return;
  input=input.trim();
  if(input.indexOf('about:')===0){
    var page=input.slice(6);
    showPage(tab,page);
    tab.url=input;
    tab.title={home:'Главная',settings:'Настройки',about:'О браузере',account:'Аккаунт',bookmarks:'Закладки',history:'История',downloads:'Загрузки'}[page]||page;
  }else if(isUrl(input)){
    var url=fixUrl(input);
    tab.url=url;
    tab.title=url.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    addHistory(url,tab.title);
    openWebview(tab,url);
  }else{
    performSearch(tab,input,state.currentCategory);
  }
  renderTabs();
}
function performSearch(tab,query,cat){
  var urls=SEARCH_URLS[state.searchEngine]||SEARCH_URLS.google,base=urls[cat]||urls.web,url;
  if(state.customSearch&&state.customSearch.indexOf('%s')>-1){
    url=state.customSearch.replace('%s',encodeURIComponent(query));
  }else{
    url=base+encodeURIComponent(query);
  }
  tab.url=url;tab.title='🔍 '+query;
  addHistory(url,tab.title);
  openWebview(tab,url);
  renderTabs();
}
function openWebview(tab,url){
  showPage(tab,'webview');
  var page=tab.pages.webview;
  var iframe=page.querySelector('iframe');
  var urlField=page.querySelector('.webview-url');
  var bkmBtn=page.querySelector('[data-role="bookmark"]');
  if(urlField)urlField.value=url;
  showLoading();
  iframe.src=url;
  applySiteZoom(tab);
  iframe.onload=function(){hideLoading()};
  iframe.onerror=function(){hideLoading();showToast('Ошибка загрузки')};
  if(bkmBtn){
    bkmBtn.dataset.url=url;
    bkmBtn.classList.toggle('active',isBookmarked(url));
    bkmBtn.textContent=isBookmarked(url)?'★':'⭐';
  }
  setTimeout(hideLoading,6000);
  var ui=$('urlInput');if(ui)ui.value=url;
}
function showPage(tab,page){
  Object.keys(tab.pages).forEach(function(k){tab.pages[k].classList.remove('active')});
  if(tab.pages[page])tab.pages[page].classList.add('active');
  tab.type=page;
  if(page==='history')renderHistory(tab);
  if(page==='bookmarks')renderBookmarks(tab);
  if(page==='downloads')renderDownloads(tab);
  if(page==='settings')setTimeout(function(){renderBatteryPreview(tab);renderSettingsExtras(tab)},30);
}

// ============ ИСТОРИЯ / ЗАКЛАДКИ ============
function addHistory(url,title){
  if(state.incognito)return;
  state.history=state.history.filter(function(h){return h.url!==url});
  state.history.unshift({url:url,title:title||url,time:Date.now()});
  if(state.history.length>300)state.history.length=300;
  ls.set(SK.history,state.history);
}
function renderHistory(tab){
  var list=tab.pages.history.querySelector('[data-role="historyList"]');
  if(!list)return;
  var inp=tab.pages.history.querySelector('[data-role="historySearch"]');
  var filter=(inp?inp.value:'').toLowerCase();
  var items=state.history.filter(function(h){
    return !filter||h.title.toLowerCase().indexOf(filter)>-1||h.url.toLowerCase().indexOf(filter)>-1;
  });
  var days=[];
  var now=new Date();
  for(var i=6;i>=0;i--){
    var d=new Date(now.getTime()-i*86400000);
    days.push({label:d.toLocaleDateString('ru-RU',{weekday:'short'}),count:0,date:d.toDateString()});
  }
  state.history.forEach(function(h){
    var hd=new Date(h.time).toDateString();
    var day=days.find(function(d){return d.date===hd});
    if(day)day.count++;
  });
  var maxC=Math.max.apply(null,days.map(function(d){return d.count}))||1;
  var chart='<div style="display:flex;align-items:flex-end;gap:6px;height:80px;padding:8px;background:var(--bg3);border-radius:10px;margin-bottom:10px">';
  days.forEach(function(d){
    var h=Math.max(4,Math.round(d.count/maxC*60));
    chart+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div title="'+d.count+' визитов" style="width:100%;height:'+h+'px;background:var(--accent);border-radius:3px;opacity:'+(d.count?0.9:0.3)+'"></div><span style="font-size:.6rem;color:var(--text2)">'+d.label+'</span></div>';
  });
  chart+='</div>';
  if(items.length===0){list.innerHTML=chart+'<div class="empty-state">Пусто</div>';return}
  list.innerHTML=chart+items.map(function(h){
    var idx=state.history.indexOf(h),d=new Date(h.time);
    return '<div class="list-item" data-url="'+eh(h.url)+'"><span>🌐</span><div class="item-info"><div class="item-title">'+eh(h.title)+'</div><div class="item-url">'+eh(h.url)+' • '+d.toLocaleString()+'</div></div><button class="item-delete" data-del-hist="'+idx+'">×</button></div>';
  }).join('');
  list.querySelectorAll('.list-item').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.delHist!==undefined)return;
      navigateTo(el.dataset.url);
    });
    var d=el.querySelector('[data-del-hist]');
    if(d)d.addEventListener('click',function(e){
      e.stopPropagation();
      state.history.splice(parseInt(e.target.dataset.delHist),1);
      ls.set(SK.history,state.history);
      renderHistory(tab);
    });
  });
}
function isBookmarked(url){return state.bookmarks.some(function(b){return b.url===url})}
function toggleBookmark(url,title){
  if(isBookmarked(url)){
    state.bookmarks=state.bookmarks.filter(function(b){return b.url!==url});
    showToast('⭐ Убрано из закладок');
  }else{
    state.bookmarks.unshift({url:url,title:title||url,time:Date.now()});
    showToast('⭐ Добавлено в закладки');
  }
  ls.set(SK.bookmarks,state.bookmarks);
  renderBookmarksBar();
  var tab=activeTab();
  if(tab)renderBookmarks(tab);
  var bkmBtn=document.querySelector('.webview-page [data-role="bookmark"]');
  if(bkmBtn){bkmBtn.textContent=isBookmarked(url)?'★':'⭐'}
}
function renderBookmarks(tab){
  var list=tab.pages.bookmarks.querySelector('[data-role="bookmarksList"]');
  if(!list)return;
  var inp=tab.pages.bookmarks.querySelector('[data-role="bookmarksSearch"]');
  var filter=(inp?inp.value:'').toLowerCase();
  var items=state.bookmarks.filter(function(b){
    return !filter||b.title.toLowerCase().indexOf(filter)>-1||b.url.toLowerCase().indexOf(filter)>-1;
  });
  if(items.length===0){list.innerHTML='<div class="empty-state">Пусто</div>';return}
  list.innerHTML=items.map(function(b){
    var idx=state.bookmarks.indexOf(b);
    return '<div class="list-item" data-url="'+eh(b.url)+'"><span>⭐</span><div class="item-info"><div class="item-title">'+eh(b.title)+'</div><div class="item-url">'+eh(b.url)+'</div></div><button class="item-delete" data-del-bm="'+idx+'">×</button></div>';
  }).join('');
  list.querySelectorAll('.list-item').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.dataset.delBm!==undefined)return;
      navigateTo(el.dataset.url);
    });
    var d=el.querySelector('[data-del-bm]');
    if(d)d.addEventListener('click',function(e){
      e.stopPropagation();
      state.bookmarks.splice(parseInt(e.target.dataset.delBm),1);
      ls.set(SK.bookmarks,state.bookmarks);
      renderBookmarks(tab);
      renderBookmarksBar();
    });
  });
}

// ============ PIN ============
var _pinResolve=null;
function askPin(){
  return new Promise(function(res){
    _pinResolve=res;
    var m=$('pinModal');
    if(!m){res(false);return}
    m.classList.add('active');
    var inp=$('pinInput');if(inp){inp.value='';inp.focus()}
  });
}
function setupPin(){
  var ok=$('pinOkBtn'),cancel=$('pinCancelBtn');
  if(ok)ok.addEventListener('click',function(){
    var v=($('pinInput')||{}).value||'';
    if(_pinResolve){_pinResolve(v===state.pinCode);_pinResolve=null}
    $('pinModal').classList.remove('active');
  });
  if(cancel)cancel.addEventListener('click',function(){
    if(_pinResolve){_pinResolve(false);_pinResolve=null}
    $('pinModal').classList.remove('active');
  });
}

// ============ РЕЖИМЫ ============
function toggleIncognito(){
  if(!state.incognito&&state.pinCode){
    askPin().then(function(ok){
      if(!ok){showToast('Неверный PIN');return}
      state.incognito=true;applyTheme();showToast('🕶️ Инкогнито вкл');
    });
    return;
  }
  state.incognito=!state.incognito;
  applyTheme();
  showToast(state.incognito?'🕶️ Инкогнито вкл':'🕶️ Инкогнито выкл');
}
function toggleNocturne(){
  state.nocturne=!state.nocturne;
  ls.set(SK.nocturne,state.nocturne);
  applyTheme();
  showToast(state.nocturne?'🌙 Ночной режим вкл':'🌙 Ночной режим выкл');
}

function openCmdPalette(){
  var p=$('cmdPalette');if(!p)return;
  p.classList.add('active');
  var input=$('cmdInput');if(input){input.value='';input.focus()}
  renderCmdList('');
}
function closeCmdPalette(){
  var p=$('cmdPalette');if(p)p.classList.remove('active');
}
var _cmdItems=[];
function renderCmdList(query){
  var list=$('cmdList');if(!list)return;
  var items=[];
  var q=(query||'').toLowerCase().trim();
  state.tabs.forEach(function(t){
    items.push({kind:'Вкладка',icon:'📑',label:t.title||'Новая',sub:t.url,action:function(){closeCmdPalette();switchTab(t.id)}});
  });
  state.history.slice(0,20).forEach(function(h){
    items.push({kind:'История',icon:'🌐',label:h.title,sub:h.url,action:function(){closeCmdPalette();navigateTo(h.url)}});
  });
  state.bookmarks.slice(0,20).forEach(function(b){
    items.push({kind:'Закладка',icon:'⭐',label:b.title,sub:b.url,action:function(){closeCmdPalette();navigateTo(b.url)}});
  });
  [
    {kind:'Команда',icon:'⚙️',label:'Настройки',sub:'about:settings',action:function(){closeCmdPalette();navigateTo('about:settings')}},
    {kind:'Команда',icon:'📥',label:'Загрузки',sub:'about:downloads',action:function(){closeCmdPalette();navigateTo('about:downloads')}},
    {kind:'Команда',icon:'📜',label:'История',sub:'about:history',action:function(){closeCmdPalette();navigateTo('about:history')}},
    {kind:'Команда',icon:'⭐',label:'Закладки',sub:'about:bookmarks',action:function(){closeCmdPalette();navigateTo('about:bookmarks')}},
    {kind:'Команда',icon:'🕶️',label:'Инкогнито',sub:'toggle',action:function(){closeCmdPalette();toggleIncognito()}},
    {kind:'Команда',icon:'🌙',label:'Ночной режим',sub:'toggle',action:function(){closeCmdPalette();toggleNocturne()}},
    {kind:'Команда',icon:'↩️',label:'Восстановить вкладку',sub:'Ctrl+Shift+T',action:function(){closeCmdPalette();restoreLastClosed()}}
  ].forEach(function(c){items.push(c)});
  if(q){
    items=items.filter(function(it){
      return (it.label||'').toLowerCase().indexOf(q)>-1||(it.sub||'').toLowerCase().indexOf(q)>-1;
    });
  }
  _cmdItems=items.slice(0,30);
  if(_cmdItems.length===0){list.innerHTML='<div class="empty-state">Ничего не найдено</div>';return}
  list.innerHTML=_cmdItems.map(function(it,i){
    return '<div class="cmd-item'+(i===0?' sel':'')+'" data-cmd-idx="'+i+'">'+
      '<span>'+it.icon+'</span>'+

// ============ АКЦЕНТ ИЗ ОБОЕВ ============
function detectAccentFromImage(dataUrl){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      c.width=40;c.height=40;
      var ctx=c.getContext('2d');
      ctx.drawImage(img,0,0,40,40);
      var data=ctx.getImageData(0,0,40,40).data;
      var r=0,g=0,b=0,n=0;
      for(var i=0;i<data.length;i+=4){r+=data[i];g+=data[i+1];b+=data[i+2];n++}
      r=Math.floor(r/n);g=Math.floor(g/n);b=Math.floor(b/n);
      r=Math.min(255,Math.floor(r*1.25));
      g=Math.min(255,Math.floor(g*1.1));
      b=Math.min(255,Math.floor(b*1.25));
      var hex='#'+[r,g,b].map(function(x){return x.toString(16).padStart(2,'0')}).join('');
      state.accentColor=hex;
      ls.set(SK.accentColor,hex);
      state.accentColorsHistory.unshift(hex);
      if(state.accentColorsHistory.length>10)state.accentColorsHistory.length=10;
      ls.set(SK.accentColors,state.accentColorsHistory);
      applyTheme();
      showToast('🎨 Акцент: '+hex);
    }catch(e){console.warn('Accent detect failed',e)}
  };
  img.onerror=function(){console.warn('Image load failed for accent')};
  img.src=dataUrl;
}

// ============ ЗАГРУЗКИ: ОЧЕРЕДЬ ============
var dlQueue=[];
var dlRunning=false;
var DL_CONCURRENCY=2;

function enqueueDownload(url,nameHint){
  var id='dl_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  var name=nameHint||'';
  if(!name){
    try{var u=new URL(url);name=decodeURIComponent(u.pathname.split('/').pop()||'file')||'file'}
    catch(e){name='file_'+Date.now()}
  }
  var item={id:id,name:name,url:url,size:0,received:0,total:0,status:'queued',time:Date.now(),blob:null,mime:'',via:''};
  downloads.unshift(item);
  state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
  dlQueue.push(item);
  processQueue();
  return item;
}
function processQueue(){
  if(dlRunning)return;
  var active=downloads.filter(function(d){return d.status==='progress'}).length;
  if(active>=DL_CONCURRENCY)return;
  var next=null;
  while(dlQueue.length>0){
    var cand=dlQueue.shift();
    if(cand.status==='queued'||cand.status==='progress'){next=cand;break}
  }
  if(!next)return;
  dlRunning=true;
  runDownload(next).finally(function(){
    dlRunning=false;
    processQueue();
  });
}
function parseContentDisposition(cd){
  if(!cd)return'';
  var m=/filename\*=(?:UTF-8'')?([^;]+)/i.exec(cd);
  if(m){try{return decodeURIComponent(m[1].replace(/["']/g,''))}catch(e){return m[1].replace(/["']/g,'')}}
  m=/filename="?([^";]+)"?/i.exec(cd);
  if(m){try{return decodeURIComponent(m[1])}catch(e){return m[1]}}
  return'';
}
async function runDownload(item){
  var ac=new AbortController();
  dlAborts[item.id]=ac;
  var attempts=[
    {label:'direct',url:item.url},
    {label:'corsproxy.io',url:'https://corsproxy.io/?url='+encodeURIComponent(item.url)},
    {label:'allorigins',url:'https://api.allorigins.win/raw?url='+encodeURIComponent(item.url)},
    {label:'cors.eu.org',url:'https://cors.eu.org/'+item.url},
    {label:'thingproxy',url:'https://thingproxy.freeboard.io/fetch/'+item.url}
  ];
  for(var i=0;i<attempts.length;i++){
    var at=attempts[i];
    try{
      item.status='progress';
      item.via=at.label;
      state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
      var resp=await fetch(at.url,{signal:ac.signal});
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      var total=parseInt(resp.headers.get('content-length')||'0',10)||0;
      item.total=total;
      item.mime=resp.headers.get('content-type')||'';
      var cdName=parseContentDisposition(resp.headers.get('content-disposition'));
      if(cdName)item.name=cdName;
      var reader=resp.body.getReader();
      var chunks=[];
      var received=0;
      while(true){
        var r=await reader.read();
        if(r.done)break;
        chunks.push(r.value);
        received+=r.value.length;
        item.received=received;
        if(received%(100*1024)<r.value.length){
          state.tabs.forEach(function(tb){
            if(tb.pages.downloads&&tb.type==='downloads')renderDownloads(tb);
          });
        }
      }
      var blob=new Blob(chunks,{type:item.mime||'application/octet-stream'});
      item.size=blob.size;
      item.blob=blob;
      item.status='done';
      item.time=Date.now();
      try{await idbPut(item)}catch(e){console.warn('IDB save failed',e)}
      triggerSave(blob,item.name);
      showToast('✅ Скачано: '+item.name+(at.label!=='direct'?' (через '+at.label+')':''));
      state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
      delete dlAborts[item.id];
      return;
    }catch(e){
      if(e.name==='AbortError'){
        item.status='cancelled';
        delete dlAborts[item.id];
        state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
        return;
      }
      console.warn('Attempt '+at.label+' failed:',e.message);
    }
  }
  item.status='error';
  delete dlAborts[item.id];
  state.tabs.forEach(function(tb){if(tb.pages.downloads)renderDownloads(tb)});
  showToast('❌ Не удалось скачать: '+item.name);
}

function doExportSettings(){

    batStyle:state.batStyle,batShow:state.batShow,batPos:state.batPos,wallpaper:state.wallpaper,

function doImportSettings(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=function(ev){
    var f=ev.target.files[0];
    if(!f)return;
    var r=new FileReader();

      try{

        ['theme','themeMode','style','font','batStyle','batShow','batPos','wallpaper','searchEngine','customSearch','tabMode','pageFont','quickLinks','bookmarks'].forEach(function(k){
          if(d[k]!==undefined)state[k]=d[k];

        ls.set(SK.batPos,state.batPos);ls.set(SK.wp,state.wallpaper);ls.set(SK.engine,state.searchEngine);
        ls.set(SK.customSearch,state.customSearch);ls.set(SK.tabMode,state.tabMode);ls.set(SK.pageFont,state.pageFont);
        ls.set(SK.quickLinks,state.quickLinks);ls.set(SK.bookmarks,state.bookmarks);
        if(d.accent){state.accentColor=d.accent;ls.set(SK.accentColor,d.accent)}

      }catch(err){showToast('Ошибка: '+err.message)}
    };
    r.readAsText(f);
  };
  inp.click();

// ============ ХЕЛПЕРЫ ============
function getTabFromEl(el){
  var p=el;
  while(p&&p!==document.body){
    if(p.classList&&p.classList.contains('page-container')){
      var tab=state.tabs.find(function(t2){
        return Object.keys(t2.pages).some(function(k){return t2.pages[k]===p});
      });
      return tab||null;
    }
    p=p.parentElement;
  }
  return null;
}
function handleAreaKeypress(e){
  if(e.key==='Enter'&&e.target.dataset.role==='homeSearch'){
    e.preventDefault();
    var tab=getTabFromEl(e.target);
    if(tab){
      var q=e.target.value.trim();
      if(q)navigateTo(q);
    }
  }
  if(e.key==='Enter'&&e.target.dataset.role==='dlUrlInput'){
    e.preventDefault();
    var tab2=getTabFromEl(e.target);
    if(tab2){
      var v=e.target.value.trim();
      if(v){
        if(!/^https?:\/\//.test(v))v='https://'+v;
        enqueueDownload(v);
        e.target.value='';
      }
    }
  }
}

    }

  setupPin();
}

// ============ ГЛАВНЫЙ ОБРАБОТЧИК КЛИКОВ ============
function handleAreaClick(e){
  var dlO=e.target.closest('[data-dl-open]');
  if(dlO){e.stopPropagation();openDownloaded(dlO.dataset.dlOpen);return}
  var dlS=e.target.closest('[data-dl-save]');
  if(dlS){e.stopPropagation();saveDownloaded(dlS.dataset.dlSave);return}
  var dlD=e.target.closest('[data-dl-del]');
  if(dlD){e.stopPropagation();deleteDownloaded(dlD.dataset.dlDel);return}
  var dlC=e.target.closest('[data-dl-cancel]');
  if(dlC){e.stopPropagation();cancelDownload(dlC.dataset.dlCancel);return}

  var delLink=e.target.closest('[data-del-link]');
  if(delLink){
    e.stopPropagation();
    var idx=parseInt(delLink.dataset.delLink);
    state.quickLinks.splice(idx,1);
    ls.set(SK.quickLinks,state.quickLinks);
    rebuildQuickLinks();
    return;
  }

  var target=e.target.closest('[data-role],[data-action],[data-url],[data-cat],[data-acc],[data-wp]');
  if(!target)return;
  var tab=getTabFromEl(target);
  if(!tab)return;

  if(target.dataset.role==='dlStartBtn'){
    var inp=tab.pages.downloads.querySelector('[data-role="dlUrlInput"]');
    var url=inp?inp.value.trim():'';
    if(!url){showToast('Введите URL файла');return}
    if(!/^https?:\/\//.test(url))url='https://'+url;
    enqueueDownload(url);
    inp.value='';
    return;
  }
  if(target.dataset.role==='dlClearAll'){clearAllDownloads();return}

  if(target.dataset.role==='weather'||target.closest('[data-role="weather"]')){
    $('cityInput').value=state.weatherCity||'';
    $('weatherResult').innerHTML='';
    $('saveWeatherBtn').style.display='none';
    $('weatherModal').classList.add('active');
    return;
  }
  if(target.dataset.role==='addLink'||target.closest('[data-role="addLink"]')){
    $('addLinkModal').classList.add('active');
    return;
  }
  if(target.dataset.role==='clockWidget'){
    showToast('📅 '+new Date().toLocaleString('ru-RU'));
    return;
  }

  // Настройки: акцент и PIN (делегирование)
  if(target.dataset.role==='resetAccent'){
    state.accentColor='';
    ls.del(SK.accentColor);
    applyTheme();
    showToast('↺ Акцент сброшен');
    return;
  }
  if(target.dataset.role==='savePin'){
    var pinInp=tab.pages.settings.querySelector('[data-role="pinInput"]');
    var v=pinInp?pinInp.value.trim():'';
    if(!/^\d{4}$/.test(v)){showToast('PIN должен быть 4 цифры');return}
    state.pinCode=v;
    ls.set(SK.pinCode,v);
    pinInp.value='';
    pinInp.placeholder='**** (установлен)';
    showToast('✅ PIN установлен');
    return;
  }
  if(target.dataset.role==='clearPin'){
    state.pinCode='';
    ls.del(SK.pinCode);
    var pinInp2=tab.pages.settings.querySelector('[data-role="pinInput"]');
    if(pinInp2){pinInp2.value='';pinInp2.placeholder='****'}
    showToast('🔓 PIN снят');
    return;
  }

  var url=target.dataset.url;
  if(url&&!target.dataset.role){navigateTo(url);return}

  var role=target.dataset.role;
  var action=target.dataset.action;

  if(role==='homeSearchBtn'){
    var inp2=tab.pages.home.querySelector('[data-role="homeSearch"]');
    var q=inp2?inp2.value.trim():'';
    if(q)navigateTo(q);
  }
  else if(role==='back'){try{tab.pages.webview.querySelector('iframe').contentWindow.history.back()}catch(err){}}
  else if(role==='fwd'){try{tab.pages.webview.querySelector('iframe').contentWindow.history.forward()}catch(err){}}
  else if(role==='reload'){var f=tab.pages.webview.querySelector('iframe');f.src=f.src}
  else if(role==='openExt'){var u2=tab.pages.webview.querySelector('.webview-url').value;if(u2)window.open(u2,'_blank')}
  else if(role==='saveSettings'){
    var q2=function(sel){return tab.pages.settings.querySelector(sel)};
    state.searchEngine=q2('[data-role="engineSelect"]').value;
    state.customSearch=q2('[data-role="customSearch"]').value;
    state.theme=q2('[data-role="themeSelect"]').value;
    state.themeMode=q2('[data-role="themeModeSelect"]').value;
    state.style=q2('[data-role="styleSelect"]').value;
    state.font=q2('[data-role="fontSelect"]').value;
    state.batStyle=q2('[data-role="batStyleSelect"]').value;
    state.batShow=q2('[data-role="batShowSelect"]').value;
    state.batPos=q2('[data-role="batPosSelect"]').value;
    state.tabMode=q2('[data-role="tabModeSelect"]').value;
    state.pageFont=parseInt(q2('[data-role="fontRange"]').value);
    ls.set(SK.engine,state.searchEngine);ls.set(SK.customSearch,state.customSearch);
    ls.set(SK.theme,state.theme);ls.set(SK.themeMode,state.themeMode);
    ls.set(SK.style,state.style);ls.set(SK.font,state.font);
    ls.set(SK.batStyle,state.batStyle);ls.set(SK.batShow,state.batShow);ls.set(SK.batPos,state.batPos);
    ls.set(SK.tabMode,state.tabMode);ls.set(SK.wp,state.wallpaper);ls.set(SK.pageFont,state.pageFont);
    applyTheme();rebuildAllTabs();
    if(navigator.getBattery){navigator.getBattery().then(function(b){renderBatteryIcon(Math.round(b.level*100),!!b.charging)})}
    else{renderBatteryIcon(100,false)}
    showToast('✅ Сохранено');
  }
  else if(role==='uploadWallpaper'){$('wallpaperFileInput').click()}
  else if(role==='resetWallpaper'){state.customWallpaper='';ls.set(SK.customWallpaper,'');applyWallpaper();rebuildAllTabs();showToast('Обои сброшены')}
  else if(role==='exportSettings')doExportSettings();
  else if(role==='importSettings')doImportSettings();
  else if(role==='exportBookmarks'){
    var html='<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
    state.bookmarks.forEach(function(b){html+='    <DT><A HREF="'+eh(b.url)+'">'+eh(b.title)+'</A>\n'});
    html+='</DL><p>';
    var blob=new Blob([html],{type:'text/html'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='bookmarks.html';a.click();
    showToast('✅ Закладки экспортированы');
  }
  else if(role==='importBookmarks'){$('bookmarksImportInput').click()}
  else if(role==='clearHistory'){if(confirm('Очистить историю?')){state.history=[];ls.set(SK.history,[]);renderHistory(tab)}}
  else if(role==='clearAll'){if(confirm('Очистить ВСЕ данные?')){Object.keys(SK).forEach(function(k){localStorage.removeItem(SK[k])});location.reload()}}
  else if(role==='avatarEdit'||role==='avatarDisplay'){$('avatarFileInput').click()}
  else if(role==='saveAccount'){
    var nick=tab.pages.account.querySelector('[data-role="nickInput"]').value.trim()||'User';
    state.account.nickname=nick;
    ls.set(SK.account,state.account);
    updateCounter();
    showToast('✅ Сохранено');
  }

  if(target.dataset.cat){
    tab.pages.home.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active')});
    target.classList.add('active');
    state.currentCategory=target.dataset.cat;
  }
  if(target.dataset.acc){
    tab.pages.account.querySelectorAll('.account-type-btn').forEach(function(b){b.classList.remove('active')});
    target.classList.add('active');
    state.account.type=target.dataset.acc;
    ls.set(SK.account,state.account);
    if(target.dataset.acc!=='local'){
      var urls={google:'https://accounts.google.com/signin',yandex:'https://passport.yandex.com/auth',microsoft:'https://login.live.com'};
      if(urls[target.dataset.acc])window.open(urls[target.dataset.acc],'_blank');
    }
  }
  if(target.dataset.wp){
    state.customWallpaper='';ls.set(SK.customWallpaper,'');
    tab.pages.settings.querySelectorAll('.wallpaper-item').forEach(function(b){b.classList.remove('active')});
    target.classList.add('active');
    state.wallpaper=target.dataset.wp;
    applyWallpaper();
  }
  if(action==='account'){showPage(tab,'account');tab.url='about:account';tab.title='Аккаунт';renderTabs()}
  else if(action==='about'){showPage(tab,'about');tab.url='about:about';tab.title='О браузере';renderTabs()}
}

// ============ ОБРАБОТЧИК ВВОДА ============
var suggestTimer=null;
function handleAreaInput(e){
  if(e.target.dataset.role==='homeSearch'){
    var val=e.target.value.trim();
    var tab=getTabFromEl(e.target);
    if(!tab)return;
    var sugg=tab.pages.home.querySelector('[data-role="suggestions"]');
    if(!sugg)return;
    if(!val){sugg.classList.remove('active');return}
    clearTimeout(suggestTimer);
    suggestTimer=setTimeout(function(){
      var suggestions=[];
      state.history.filter(function(h){return h.title.toLowerCase().indexOf(val.toLowerCase())>-1||h.url.toLowerCase().indexOf(val.toLowerCase())>-1})
        .slice(0,3).forEach(function(h){suggestions.push({icon:'🕐',text:h.title,url:h.url})});
      suggestions.push({icon:'🔍',text:val,search:val});
      suggestions.push({icon:'📖',text:val+' wiki',search:val+' wikipedia'});
      suggestions.push({icon:'▶️',text:val+' видео',search:val+' video'});
      suggestions.push({icon:'📰',text:val+' новости',search:val+' news'});
      sugg.innerHTML=suggestions.map(function(s,i){
        return '<div class="suggestion-item" data-sugg-idx="'+i+'"><span>'+s.icon+'</span><span>'+eh(s.text)+'</span></div>';
      }).join('');
      sugg.classList.add('active');
      sugg.querySelectorAll('.suggestion-item').forEach(function(item){
        item.addEventListener('click',function(){
          var s=suggestions[parseInt(item.dataset.suggIdx)];
          sugg.classList.remove('active');
          if(s.url)navigateTo(s.url);
          else if(s.search){e.target.value=s.search;navigateTo(s.search)}
        });
      });
    },200);
  }
  else if(e.target.dataset.role==='fontRange'){
    var v=parseInt(e.target.value);
    state.pageFont=v;
    document.documentElement.style.setProperty('--page-font',v+'%');
    var tab2=getTabFromEl(e.target);
    if(tab2&&tab2.pages.settings){
      var l=tab2.pages.settings.querySelector('[data-role="fontLabel"]');
      if(l)l.textContent=v+'%';
    }
  }
  else if(e.target.dataset.role==='fontSelect'){state.font=e.target.value;applyTheme()}
  else if(e.target.dataset.role==='batStyleSelect'){
    state.batStyle=e.target.value;
    var tB=getTabFromEl(e.target);
    if(tB)renderBatteryPreview(tB);
    if(navigator.getBattery)navigator.getBattery().then(function(b){renderBatteryIcon(Math.round(b.level*100),!!b.charging)});
  }
  else if(e.target.dataset.role==='batShowSelect'){state.batShow=e.target.value;if(navigator.getBattery)navigator.getBattery().then(function(b){renderBatteryIcon(Math.round(b.level*100),!!b.charging)})}
  else if(e.target.dataset.role==='batPosSelect'){state.batPos=e.target.value;if(navigator.getBattery)navigator.getBattery().then(function(b){renderBatteryIcon(Math.round(b.level*100),!!b.charging)})}
  else if(e.target.dataset.role==='historySearch'){var t4=getTabFromEl(e.target);if(t4)renderHistory(t4)}
  else if(e.target.dataset.role==='bookmarksSearch'){var t5=getTabFromEl(e.target);if(t5)renderBookmarks(t5)}
}

// ============ INIT ============
function init(){
  try{
    applyTheme();
    setupEvents();
    createTab('about:home');
    restoreSession();
// Обработка ?page= из PWA shortcuts
try{
  var params = new URLSearchParams(location.search);
  var startPage = params.get('page');
  if(startPage && ['settings','downloads','history','bookmarks','account','about'].indexOf(startPage) > -1){
    navigateTo('about:' + startPage);
  }
}catch(e){}
    updateClocks();
    setInterval(updateClocks,1000);
    loadDownloads();
    if(state.weatherCity){
      fetchWeather(state.weatherCity).then(function(r){
        if(r){state.weatherData=r;state.weatherData.cityName=state.weatherCity;ls.set(SK.weatherData,state.weatherData);updateWeatherWidgets()}
      });
    }
    updateBattery();
    if(window.matchMedia){
      try{
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(){
          if(state.themeMode==='auto')applyTheme();
        });
      }catch(e){}
    }
    console.log('AnoBrowser 1.3.0 запущен');
  }catch(e){
    console.error('Init error:',e);
    alert('Ошибка: '+e.message);
  }
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

})();
